name: Apply mod and build

on:
  workflow_dispatch:
  push:
    branches: [main, master, beta]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply mod file copies
        run: |
          if [ -f mod/apply.sh ]; then
            bash mod/apply.sh
          else
            echo "No mod/apply.sh, skip"
          fi

      # 必须在 apply.sh 复制完源码补丁之后、Gradle 之前执行
      - name: Disable MPV (inject + verify)
        run: |
          set -euo pipefail
          if [ ! -f mod/hooks/inject_disable_mpv.py ]; then
            echo "ERROR: mod/hooks/inject_disable_mpv.py not found"
            exit 1
          fi
          python3 mod/hooks/inject_disable_mpv.py .
          echo "---- post-inject grep proof ----"
          grep -n "MPV_DISABLED\|KERNEL_ORDER = {EXO, IJK, SYSTEM}\|new ExoPlayerEngine.*MPV_DISABLED\|visible = false; // MPV_DISABLED" \
            app/src/main/java/com/fongmi/android/tv/setting/PlayerSetting.java \
            app/src/main/java/com/fongmi/android/tv/player/PlayerManager.java \
            app/src/mobile/java/com/fongmi/android/tv/ui/fragment/SettingPlayerFragment.java \
            app/src/leanback/java/com/fongmi/android/tv/ui/activity/SettingPlayerActivity.java \
            2>/dev/null || true
          # 硬性证明：不允许再出现引擎创建
          if grep -R "new MpvPlayerEngine" app/src/main/java/com/fongmi/android/tv/player/PlayerManager.java; then
            echo "ERROR: new MpvPlayerEngine still present"
            exit 1
          fi
          if ! grep -q "KERNEL_ORDER = {EXO, IJK, SYSTEM}" app/src/main/java/com/fongmi/android/tv/setting/PlayerSetting.java; then
            echo "ERROR: KERNEL_ORDER still contains MPV"
            exit 1
          fi
          echo "MPV disable verified"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform 37
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" || true
          yes | sdkmanager --licenses || true

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APKs
        run: |
          bash gradlew --no-daemon \
            :app:assembleMobileArm64_v8aDebug \
            :app:assembleLeanbackArm64_v8aDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-with-mod
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
