# 插入在「Apply mod patches」与「Relax Gradle Daemon JVM lock」之间
      - name: Disable MPV (inject + verify)
        if: steps.should_build.outputs.build == 'true'
        run: |
          set -euo pipefail
          if [ ! -f mod/hooks/inject_disable_mpv.py ]; then
            echo "ERROR: mod/hooks/inject_disable_mpv.py missing"
            exit 1
          fi
          python3 mod/hooks/inject_disable_mpv.py .
          echo "---- post-inject proof ----"
          grep -n "MPV_DISABLED" app/src/main/java/com/fongmi/android/tv/setting/PlayerSetting.java || true
          grep -n "MPV_DISABLED" app/src/main/java/com/fongmi/android/tv/player/PlayerManager.java || true
          grep -n "MPV_DISABLED" app/src/main/java/com/fongmi/android/tv/ui/dialog/PlayerKernelDialog.java || true
          if grep -q "new MpvPlayerEngine" app/src/main/java/com/fongmi/android/tv/player/PlayerManager.java; then
            echo "ERROR: new MpvPlayerEngine still present"
            exit 1
          fi
          if ! grep -q "MPV_DISABLED: never construct MpvPlayerEngine" app/src/main/java/com/fongmi/android/tv/player/PlayerManager.java; then
            echo "ERROR: buildEngine guard missing"
            exit 1
          fi
          echo "MPV disable verified"
