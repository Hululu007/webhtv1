# 接在 Disable MPV (inject + verify) 成功之后：
      - name: Strip MPV native assets (phase 2)
        if: steps.should_build.outputs.build == 'true'
        run: |
          set -euo pipefail
          python3 mod/hooks/inject_strip_mpv_assets.py .
          if find app -path '*/mpv-libs/*.so' 2>/dev/null | grep -q .; then
            echo "ERROR: mpv-libs .so still present"
            find app -path '*/mpv-libs/*.so'
            exit 1
          fi
          echo "MPV native strip verified"
